[package]
name = "buscapreco"
version = "0.0.2"
edition = "2021"
description = "Port do servidor Gertec Busca Preço (ServUni) — serviço + TUI"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "any"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
ratatui = "0.29"
crossterm = "0.28"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[[bin]]
name = "buscapreco"
path = "src/main.rs"
