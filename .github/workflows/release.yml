name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      changelog: ${{ steps.tag.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Versionamento semântico automático a partir de conventional commits:
      # feat: -> minor | fix: -> patch | BREAKING CHANGE/!: -> major
      - name: Próxima tag semântica
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Bump versão no Cargo.toml
        if: steps.tag.outputs.new_tag != ''
        run: |
          VER="${{ steps.tag.outputs.new_tag }}"   # vX.Y.Z
          NUM="${VER#v}"
          sed -i "s/^version = \".*\"/version = \"$NUM\"/" Cargo.toml
          cargo generate-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump versão para $VER [skip ci]" || true
          git push

      - name: Build (release)
        if: steps.tag.outputs.new_tag != ''
        run: cargo build --release --locked

      - name: Empacotar binário linux-amd64
        if: steps.tag.outputs.new_tag != ''
        run: |
          mkdir -p dist
          tar -czf dist/buscapreco-${{ steps.tag.outputs.new_tag }}-linux-amd64.tar.gz \
            -C target/release buscapreco
          sha256sum dist/*.tar.gz > dist/checksums.txt

      - name: GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt

  docker:
    needs: release
    if: needs.release.outputs.new_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Nome da imagem (minúsculo)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
